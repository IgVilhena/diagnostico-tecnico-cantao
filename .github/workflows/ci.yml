name: CI & Build

on:
  push:
    branches:
      - main
      - joao
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    name: Compilar e Testar (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Compilar DiagnosticoTecnico.exe
        shell: cmd
        run: call build.bat

      - name: Verificar binário gerado
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath "DiagnosticoTecnico.exe")) {
            throw "DiagnosticoTecnico.exe não foi gerado."
          }
          Get-Item -LiteralPath "DiagnosticoTecnico.exe" | Select-Object Name, Length, LastWriteTime

      - name: Executar testes automatizados (UI, Teclado e WinPE)
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tests\run.ps1

      - name: Publicar artefato do executável
        uses: actions/upload-artifact@v4
        with:
          name: DiagnosticoTecnico
          path: |
            DiagnosticoTecnico.exe
            Iniciar-WinPE.cmd
            LEIA-ME.txt
            LEIA-ME-WINPE.txt
          if-no-files-found: error

      - name: Publicar relatórios e capturas dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: artifacts/
          if-no-files-found: ignore

      - name: Criar Release no GitHub (Tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            DiagnosticoTecnico.exe
            Iniciar-WinPE.cmd
            LEIA-ME.txt
            LEIA-ME-WINPE.txt
